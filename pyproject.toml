[project]
name = "deckhand"
version = "0.3.0"
description = "Local-first orchestration service for Stream Deck via OpenDeck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "websockets",
  "aiohttp",
  "httpx",
  "typer",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
]

[project.scripts]
deckhand = "deckhand.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
